resource:
    name: OrderAmendments
    shortName: order-amendments

    properties:
        uuid:
            type: string
            description: 'Order amendment UUID (identifier).'
            identifier: true
            readable: true
            writable: false
            openapiContext:
                example: 'b1c2d3e4-f5a6-7890-abcd-ef1234567890'

        createdAt:
            type: string
            description: 'Amendment creation timestamp (Y-m-d H:i:s.u).'
            readable: true
            writable: false
            openapiContext:
                example: '2026-01-15 10:30:00.000000'

        updatedAt:
            type: string
            description: 'Amendment last-update timestamp (Y-m-d H:i:s.u).'
            readable: true
            writable: false
            openapiContext:
                example: '2026-01-15 11:45:00.000000'
