resource:
    name: Carts
    shortName: carts

    properties:
        amendmentOrderReference:
            type: string
            writable: false
            readable: true
            required: false
            responseOptional: true
            description: 'Order reference when the cart is an amendment of an existing order. Answered only for such a cart; an ordinary shopping cart carries none. The populated case is pinned by the OrderAmendments suite.'
            openapiContext:
                example: 'DE--1'
